name: CI/CD

env:
  GO_VERSION: "1.26.9"
  GOLANGCI_LINT_VERSION: "2.13.2"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/.go-version
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      - name: Candidate linter baseline - errorlint
        continue-on-error: true
        run: golangci-lint run --enable-only errorlint --issues-exit-code=0 ./...

      - name: Candidate linter baseline - contextcheck
        continue-on-error: true
        run: golangci-lint run --enable-only contextcheck --issues-exit-code=0 ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: PostgreSQL integration tests
        run: go test -tags integration -count=1 ./...

      - name: Verify generated Wire code
        run: make generate-check

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...
          work-dir: backend

      - name: Build
        run: go build ./cmd/api

      - name: Compose config validation
        run: cp .env.example .env && docker compose config -q

      - name: Prod compose config validation
        working-directory: .
        run: cp .env.example .env && docker compose -f docker-compose.prod.yml config -q

  backend-docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  frontend-docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-docker, frontend-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.prod.yml и SQL-миграции всегда доставляются свежими из репозитория
      # (сервис migrations монтирует их как bind mount); .env на сервере заводится один раз
      # вручную (см. .env.example) и этим шагом не трогается
      - name: Copy compose file and migrations to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.prod.yml,backend/db/migrations
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml pull frontend backend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            for attempt in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend /app/developers-cv-api healthcheck; then
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            docker compose -f docker-compose.prod.yml logs --tail=100 backend migrations
            exit 1
