name: Stage

on:
  push:
    branches: [stage]

concurrency:
  group: stage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    name: images (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            build-args: ""
          - name: frontend
            build-args: |
              VITE_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_STAGE }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.name }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:stage

  deploy:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file and migrations to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.stage.yml,backend/db/migrations
          target: ${{ secrets.DEPLOY_PATH_STAGE }}

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH_STAGE }}
            docker compose -f docker-compose.stage.yml pull frontend backend
            docker compose -f docker-compose.stage.yml up -d --remove-orphans
            docker image prune -f
