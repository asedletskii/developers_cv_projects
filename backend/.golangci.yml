version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - bodyclose
    - sqlclosecheck
    - misspell
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      excludes:
        - G115
  exclusions:
    generated: lax
formatters:
  enable:
    - gofmt
    - goimports
