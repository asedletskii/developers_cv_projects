          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      parameters:
      - name: code
        in: query
        required: false
        description: OAuth authorization code.
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: OAuth state.
        schema:
          type: string
