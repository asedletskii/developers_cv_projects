  /health:
    get:
      tags:
      - Operations
      summary: Liveness probe
      operationId: get_health
      description: 'Liveness only; returns {status: "ok"}. It does not check database or external dependencies.'
      responses:
        '200':
          description: Liveness check succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
      servers:
      - url: /
        description: Root path outside `/api/v1`.
